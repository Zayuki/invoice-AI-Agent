[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "fastapi",
    "httpx",
    "jinja2",
    "langchain-openai",
    "langgraph-checkpoint-sqlite",
    "playwright",
    "pydantic>=2",
    "pypdf",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = ["httpx2", "pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
invoice_agent = ["templates/*.html"]
